name: ocr-review-bot
services:
  ocr-review-bot:
    image: localhost/ocr-review-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-review-bot
    volumes:
      - bot-data:/data
      - ocr-config:/root/.opencodereview
      - ./build/config-docker.json:/app/config.json:ro
    ports:
      - "8080:8080"
    environment:
      - OCR_BOT_CONFIG=/app/config.json
      - GITLAB_TOKEN
      - OCR_LLM_TOKEN
      - OCR_VIEWER_URL
      - OCR_AUTH_ENABLED
      - OCR_BOOTSTRAP_ADMIN_USERNAME
      - OCR_BOOTSTRAP_ADMIN_EMAIL
      - OCR_BOOTSTRAP_ADMIN_PASSWORD
      - OCR_OIDC_ISSUER_URL
      - OCR_OIDC_CLIENT_ID
      - OCR_OIDC_CLIENT_SECRET
      - OCR_OIDC_REDIRECT_URL
      - OCR_ADMIN_TOKEN
      - OCR_ADMIN_ROLE
    restart: unless-stopped

volumes:
  bot-data:
  ocr-config:
